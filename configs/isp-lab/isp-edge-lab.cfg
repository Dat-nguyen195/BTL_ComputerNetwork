! TV1 IOS reference configuration - 2026-10-26
! Status: NOT RUN on Cisco IOS / Packet Tracer; feature support must be checked.
! Model reference: Cisco 2911; map interfaces when using another model.
! Use console for this lab; SSH/AAA and security hardening belong to TV3.

! Compatibility filename retained for ISP1. Load only into ISP1.
hostname ISP1
ip cef
interface GigabitEthernet0/0
 description To-Main-Edge-Gi0/1
 ip address 203.0.113.1 255.255.255.252
 no shutdown
interface GigabitEthernet0/1
 description Upstream-to-INET-Core-Gi0/0
 ip address 192.0.2.129 255.255.255.252
 no shutdown
ip route 192.0.2.0 255.255.255.0 192.0.2.130
!
line con 0
 logging synchronous
line vty 0 4
 transport input none
!
end
