! TV1 IOS reference configuration - 2026-10-26
! Status: NOT RUN on Cisco IOS / Packet Tracer; feature support must be checked.
! Model reference: Cisco 2911; map interfaces when using another model.
! Use console for this lab; SSH/AAA and security hardening belong to TV3.

hostname INET-Core
ip cef
interface GigabitEthernet0/0
 description To-ISP1-Gi0/1
 ip address 192.0.2.130 255.255.255.252
 no shutdown
interface GigabitEthernet0/1
 description To-ISP2-Gi0/1
 ip address 192.0.2.134 255.255.255.252
 no shutdown
interface GigabitEthernet0/2
 description To-Web-Lab-via-switch-if-needed
 ip address 192.0.2.65 255.255.255.192
 no shutdown
interface Loopback11
 description ISP1-health-target-reached-via-ISP1-pinned-route
 ip address 192.0.2.11 255.255.255.255
interface Loopback22
 description ISP2-health-target-reached-via-ISP2-pinned-route
 ip address 192.0.2.22 255.255.255.255
ip route 203.0.113.0 255.255.255.252 192.0.2.129
ip route 198.51.100.0 255.255.255.252 192.0.2.133
!
line con 0
 logging synchronous
line vty 0 4
 transport input none
!
end
