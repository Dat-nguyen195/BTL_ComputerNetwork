! TV1 IOS reference configuration - 2026-10-26
! Status: NOT RUN on Cisco IOS / Packet Tracer; feature support must be checked.
! Model reference: Cisco 2911; map interfaces when using another model.
! Use console for this lab; SSH/AAA and security hardening belong to TV3.

hostname ISP2
ip cef
interface GigabitEthernet0/0
 description To-Main-Edge-Gi0/2
 ip address 198.51.100.1 255.255.255.252
 no shutdown
interface GigabitEthernet0/1
 description Upstream-to-INET-Core-Gi0/1
 ip address 192.0.2.133 255.255.255.252
 no shutdown
ip route 192.0.2.0 255.255.255.0 192.0.2.134
!
line con 0
 logging synchronous
line vty 0 4
 transport input none
!
end
