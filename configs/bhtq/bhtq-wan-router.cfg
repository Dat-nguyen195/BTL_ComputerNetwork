! ==============================================================================
! CẤU HÌNH ROUTER BHTQ GATEWAY (BHTQ-GW)
! Dự án: Thiết kế và Mô phỏng Mạng Bệnh viện 3 Site (Main - DBP - BHTQ)
! Tác giả: TV1 - Trưởng nhóm, WAN & Routing Lead
! Reference: Cisco 2911; NOT RUN; remap interfaces for other models.
! ==============================================================================

service timestamps log datetime msec
service timestamps debug datetime msec
no service password-encryption
!
hostname BHTQ-GW
!
boot-start-marker
boot-end-marker
!
no aaa new-model
!
ip cef
!
! --- Cấu hình giao diện WAN Leased Line về Main ---
interface Loopback0
 description Router-ID BHTQ-GW
 ip address 10.30.255.1 255.255.255.255
!
interface Serial0/0/0
 description Leased-Line-ve-Main-GW
 bandwidth 2000
 ip ospf cost 10
 ip address 10.255.0.6 255.255.255.252
 no shutdown
!
! --- Cấu hình giao diện LAN & Subinterfaces (Router-on-a-stick) ---
interface GigabitEthernet0/0
 description Trunk-noi-Switch-BHTQ
 no ip address
 duplex auto
 speed auto
 no shutdown
!
interface GigabitEthernet0/0.10
 description VLAN-10-Nghiep-vu-1-BHTQ
 encapsulation dot1Q 10
 ip address 10.30.10.1 255.255.255.128
!
interface GigabitEthernet0/0.20
 description VLAN-20-Nghiep-vu-2-BHTQ
 encapsulation dot1Q 20
 ip address 10.30.20.1 255.255.255.128
!
interface GigabitEthernet0/0.30
 description VLAN-30-Nghiep-vu-3-BHTQ
 encapsulation dot1Q 30
 ip address 10.30.30.1 255.255.255.128
!
interface GigabitEthernet0/0.70
 description VLAN-70-Server-BHTQ
 encapsulation dot1Q 70
 ip address 10.30.70.1 255.255.255.240
!
interface GigabitEthernet0/0.90
 description VLAN-90-Management-BHTQ
 encapsulation dot1Q 90
 ip address 10.30.90.1 255.255.255.0
!
interface GigabitEthernet0/0.100
 description VLAN-100-Guest-WiFi-BHTQ
 encapsulation dot1Q 100
 ip address 10.30.100.1 255.255.254.0
!
interface GigabitEthernet0/0.110
 description VLAN-110-Camera-BHTQ
 encapsulation dot1Q 110
 ip address 10.30.110.1 255.255.255.0
!
interface GigabitEthernet0/0.120
 description VLAN-120-Staff-WiFi-BHTQ
 encapsulation dot1Q 120
 ip address 10.30.120.1 255.255.255.0
!
! --- Dinh tuyen OSPFv2 Single Area 0 ---
! Discard unused local-site addresses; do not return them through default.
ip route 10.30.0.0 255.255.0.0 Null0 254
!
router ospf 1
 router-id 10.30.255.1
 passive-interface default
 no passive-interface Serial0/0/0
 network 10.255.0.4 0.0.0.3 area 0
 network 10.30.0.0 0.0.255.255 area 0
 network 10.30.255.1 0.0.0.0 area 0
!
! --- Quan ly truy cap ---
line con 0
 logging synchronous
line vty 0 4
 transport input none
!
end
