! TV1 IOS reference configuration - 2026-10-26
! Status: NOT RUN on Cisco IOS / Packet Tracer; feature support must be checked.
! Model reference: Cisco 2911; map interfaces when using another model.
! Use console for this lab; SSH/AAA and security hardening belong to TV3.

hostname Main-Edge
ip cef
!
interface Loopback0
 ip address 10.255.255.1 255.255.255.255
!
interface GigabitEthernet0/0
 description Inside-to-Main-FW-Gi0/1
 ip address 10.255.0.18 255.255.255.252
 ip nat inside
 ip policy route-map LOAD-BALANCE-PBR
 no shutdown
!
interface GigabitEthernet0/1
 description Egress-to-ISP1-Gi0/0
 ip address 203.0.113.2 255.255.255.252
 ip nat outside
 no shutdown
!
interface GigabitEthernet0/2
 description Egress-to-ISP2-Gi0/0
 ip address 198.51.100.2 255.255.255.252
 ip nat outside
 no shutdown
!
! Specific return routes avoid a broad 10/8 loop with the firewall default.
ip route 10.10.0.0 255.255.0.0 10.255.0.17
ip route 10.20.0.0 255.255.0.0 10.255.0.17
ip route 10.30.0.0 255.255.0.0 10.255.0.17
!
! Probe endpoints are behind the ISP upstream link, on INET-Core loopbacks.
! Pinned /32 plus Null0 fallback prevents testing a failed ISP over the other ISP.
ip route 192.0.2.11 255.255.255.255 GigabitEthernet0/1 203.0.113.1
ip route 192.0.2.11 255.255.255.255 Null0 254
ip route 192.0.2.22 255.255.255.255 GigabitEthernet0/2 198.51.100.1
ip route 192.0.2.22 255.255.255.255 Null0 254
ip sla 1
 icmp-echo 192.0.2.11 source-interface GigabitEthernet0/1
 timeout 1000
 frequency 3
ip sla schedule 1 life forever start-time now
track 1 ip sla 1 reachability
 delay down 6 up 6
!
ip sla 2
 icmp-echo 192.0.2.22 source-interface GigabitEthernet0/2
 timeout 1000
 frequency 3
ip sla schedule 2 life forever start-time now
track 2 ip sla 2 reachability
 delay down 6 up 6
!
ip route 0.0.0.0 0.0.0.0 GigabitEthernet0/1 203.0.113.1 track 1
ip route 0.0.0.0 0.0.0.0 GigabitEthernet0/2 198.51.100.1 track 2
!
! Traffic to private networks uses the normal RIB and is not policy-routed out.
access-list 103 permit ip any 10.0.0.0 0.255.255.255
route-map LOAD-BALANCE-PBR permit 5
 match ip address 103
!
! Group 1 prefers ISP1; group 2 prefers ISP2. No 50/50 throughput guarantee.
access-list 101 permit ip 10.10.10.0 0.0.0.127 any
access-list 101 permit ip 10.10.30.0 0.0.0.127 any
access-list 101 permit ip 10.10.50.0 0.0.0.127 any
access-list 101 permit ip 10.10.70.0 0.0.0.31 any
access-list 101 permit ip 10.10.90.0 0.0.0.255 any
access-list 101 permit ip 10.10.110.0 0.0.0.255 any
access-list 101 permit ip host 10.10.255.2 any
access-list 101 permit ip 10.20.0.0 0.0.255.255 any
access-list 102 permit ip 10.10.20.0 0.0.0.127 any
access-list 102 permit ip 10.10.40.0 0.0.0.127 any
access-list 102 permit ip 10.10.60.0 0.0.0.127 any
access-list 102 permit ip 10.10.80.0 0.0.0.31 any
access-list 102 permit ip 10.10.100.0 0.0.1.255 any
access-list 102 permit ip 10.10.120.0 0.0.0.255 any
access-list 102 permit ip host 10.10.255.1 any
access-list 102 permit ip 10.30.0.0 0.0.255.255 any
route-map LOAD-BALANCE-PBR permit 10
 match ip address 101
 set ip next-hop verify-availability 203.0.113.1 1 track 1
 set ip next-hop verify-availability 198.51.100.1 2 track 2
route-map LOAD-BALANCE-PBR permit 20
 match ip address 102
 set ip next-hop verify-availability 198.51.100.1 1 track 2
 set ip next-hop verify-availability 203.0.113.1 2 track 1
!
! ACL 100 selects NAT candidates, NOT access permission; TV3 owns firewall rules.
access-list 100 deny ip 10.0.0.0 0.255.255.255 10.0.0.0 0.255.255.255
access-list 100 permit ip 10.10.0.0 0.0.255.255 any
access-list 100 permit ip 10.20.0.0 0.0.255.255 any
access-list 100 permit ip 10.30.0.0 0.0.255.255 any
route-map NAT-ISP1 permit 10
 match ip address 100
 match interface GigabitEthernet0/1
route-map NAT-ISP2 permit 10
 match ip address 100
 match interface GigabitEthernet0/2
ip nat inside source route-map NAT-ISP1 interface GigabitEthernet0/1 overload
ip nat inside source route-map NAT-ISP2 interface GigabitEthernet0/2 overload
!
line con 0
 logging synchronous
line vty 0 4
 transport input none
!
end
