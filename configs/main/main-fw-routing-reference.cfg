! TV1 IOS reference configuration - 2026-10-26
! Status: NOT RUN on Cisco IOS / Packet Tracer; feature support must be checked.
! Model reference: Cisco 2911; map interfaces when using another model.
! Use console for this lab; SSH/AAA and security hardening belong to TV3.

! ROUTING-ONLY stand-in for the TV3 firewall. No security / VPN acceptance here.
! Do not paste into an ASA; replace with equivalent ASA/zone routing + policies.
hostname Main-FW
ip cef
interface GigabitEthernet0/0
 description Inside-to-Main-Core-Gi0/2
 ip address 10.255.0.14 255.255.255.252
 no shutdown
interface GigabitEthernet0/1
 description Outside-to-Main-Edge-Gi0/0
 ip address 10.255.0.17 255.255.255.252
 no shutdown
interface GigabitEthernet0/2
 description DMZ-VLAN80-test-switch
 ip address 10.10.80.1 255.255.255.224
 no shutdown
ip route 10.10.0.0 255.255.0.0 10.255.0.13
ip route 10.20.0.0 255.255.0.0 10.255.0.13
ip route 10.30.0.0 255.255.0.0 10.255.0.13
ip route 0.0.0.0 0.0.0.0 10.255.0.18
! No NAT on this stand-in. PAT is centralized on Main-Edge.
!
line con 0
 logging synchronous
line vty 0 4
 transport input none
!
end
