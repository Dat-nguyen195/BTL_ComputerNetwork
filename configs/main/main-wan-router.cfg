! TV1 IOS reference configuration - 2026-10-26
! Status: NOT RUN on Cisco IOS / Packet Tracer; feature support must be checked.
! Model reference: Cisco 2911; map interfaces when using another model.
! Use console for this lab; SSH/AAA and security hardening belong to TV3.

hostname Main-GW
ip cef
!
interface Loopback0
 description Main-GW-Router-ID-and-health-probe-source
 ip address 10.10.255.2 255.255.255.255
!
! Serial is a FUNCTIONAL substitute for Metro-E, NOT a 150-Mbps measurement.
! Apply clock rate only on the DCE cable end (Main-GW in the reference lab).
interface Serial0/0/0
 description Leased-Line-model-to-DBP
 bandwidth 2000
 ip address 10.255.0.1 255.255.255.252
 ip ospf cost 10
 clock rate 2000000
 no shutdown
!
interface Serial0/0/1
 description Leased-Line-model-to-BHTQ
 bandwidth 2000
 ip address 10.255.0.5 255.255.255.252
 ip ospf cost 10
 clock rate 2000000
 no shutdown
!
interface GigabitEthernet0/0
 description Transit-to-Main-Core-Gi0/1
 ip address 10.255.0.10 255.255.255.252
 ip ospf network point-to-point
 ip ospf cost 1
 no shutdown
!
! Independent /32 route keeps probing possible after the default is withdrawn.
ip route 192.0.2.100 255.255.255.255 GigabitEthernet0/0 10.255.0.9
ip route 192.0.2.100 255.255.255.255 Null0 254
ip sla 10
 icmp-echo 192.0.2.100 source-interface Loopback0
 timeout 1000
 frequency 3
ip sla schedule 10 life forever start-time now
track 10 ip sla 10 reachability
 delay down 6 up 6
!
ip route 0.0.0.0 0.0.0.0 GigabitEthernet0/0 10.255.0.9 track 10
!
! Discard unallocated site addresses instead of returning them through default.
ip route 10.10.0.0 255.255.0.0 Null0 254
ip route 10.20.0.0 255.255.0.0 Null0 254
ip route 10.30.0.0 255.255.0.0 Null0 254
!
router ospf 1
 router-id 10.10.255.2
 passive-interface default
 no passive-interface Serial0/0/0
 no passive-interface Serial0/0/1
 no passive-interface GigabitEthernet0/0
 network 10.255.0.0 0.0.0.3 area 0
 network 10.255.0.4 0.0.0.3 area 0
 network 10.255.0.8 0.0.0.3 area 0
 network 10.10.255.2 0.0.0.0 area 0
 default-information originate metric 10
!
line con 0
 logging synchronous
line vty 0 4
 transport input none
!
end
