! COMPOSED REFERENCE - NOT RUN on IOS. Source: configs/main/main-core-transit-reference.cfg
! Base comments describe the routing source; the TV3 overlay below adds policy where configured.
! TV1 IOS reference configuration - 2026-10-26
! Status: NOT RUN on Cisco IOS / Packet Tracer; feature support must be checked.
! Model reference: Cisco 2911; map interfaces when using another model.
! Use console for this lab; SSH/AAA and security hardening belong to TV3.

! ROUTING-ONLY integration reference; TV2 must merge campus LAN/trunks/ACLs.
! Router-on-a-stick is used so this minimal lab has only IOS router dependencies.
hostname Main-Core
ip cef
interface Loopback0
 ip address 10.10.255.1 255.255.255.255
interface GigabitEthernet0/1
 description To-Main-GW-Gi0/0
 ip address 10.255.0.9 255.255.255.252
 ip ospf network point-to-point
 ip ospf cost 1
 no shutdown
interface GigabitEthernet0/2
 description To-Main-FW-Gi0/0
 ip address 10.255.0.13 255.255.255.252
 no shutdown
interface GigabitEthernet0/0
 description Trunk-to-TV2-Main-test-switch
 no ip address
 no shutdown
interface GigabitEthernet0/0.10
 encapsulation dot1Q 10
 ip address 10.10.10.1 255.255.255.128
!
interface GigabitEthernet0/0.20
 encapsulation dot1Q 20
 ip address 10.10.20.1 255.255.255.128
!
interface GigabitEthernet0/0.30
 encapsulation dot1Q 30
 ip address 10.10.30.1 255.255.255.128
!
interface GigabitEthernet0/0.40
 encapsulation dot1Q 40
 ip address 10.10.40.1 255.255.255.128
!
interface GigabitEthernet0/0.50
 encapsulation dot1Q 50
 ip address 10.10.50.1 255.255.255.128
!
interface GigabitEthernet0/0.60
 encapsulation dot1Q 60
 ip address 10.10.60.1 255.255.255.128
!
interface GigabitEthernet0/0.70
 encapsulation dot1Q 70
 ip address 10.10.70.1 255.255.255.224
!
interface GigabitEthernet0/0.90
 encapsulation dot1Q 90
 ip address 10.10.90.1 255.255.255.0
!
interface GigabitEthernet0/0.100
 encapsulation dot1Q 100
 ip address 10.10.100.1 255.255.254.0
!
interface GigabitEthernet0/0.110
 encapsulation dot1Q 110
 ip address 10.10.110.1 255.255.255.0
!
interface GigabitEthernet0/0.120
 encapsulation dot1Q 120
 ip address 10.10.120.1 255.255.255.0
!
! Return summaries plus discard routes stop Core/FW loops for unused site IPs.
! Active OSPF/connected more-specific subnets win over these aggregate routes.
ip route 10.10.0.0 255.255.0.0 Null0 254
ip route 10.20.0.0 255.255.0.0 10.255.0.10
ip route 10.30.0.0 255.255.0.0 10.255.0.10
! DMZ VLAN80 terminates on Main-FW, NOT on the core trunk.
ip route 10.10.80.0 255.255.255.224 10.255.0.14
ip route 192.0.2.100 255.255.255.255 GigabitEthernet0/2 10.255.0.14
ip route 192.0.2.100 255.255.255.255 Null0 254
ip sla 10
 icmp-echo 192.0.2.100 source-interface Loopback0
 timeout 1000
 frequency 3
ip sla schedule 10 life forever start-time now
track 10 ip sla 10 reachability
 delay down 6 up 6
ip route 0.0.0.0 0.0.0.0 GigabitEthernet0/2 10.255.0.14 track 10
router ospf 1
 router-id 10.10.255.1
 passive-interface default
 no passive-interface GigabitEthernet0/1
 network 10.10.0.0 0.0.255.255 area 0
 network 10.255.0.8 0.0.0.3 area 0
 redistribute static subnets route-map DMZ-ONLY
ip prefix-list DMZ-PREFIX permit 10.10.80.0/27
route-map DMZ-ONLY permit 10
 match ip address prefix-list DMZ-PREFIX
!
line con 0
 logging synchronous
line vty 0 4
 transport input none
