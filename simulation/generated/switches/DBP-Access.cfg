! Minimal TV4 lab switch; review against TV2 campus module before use.
! Reference: 2960 with FastEthernet0/1-24 and GigabitEthernet0/1-2.
hostname DBP-Access
vlan 10
 name LAB-V10
vlan 20
 name LAB-V20
vlan 30
 name LAB-V30
vlan 70
 name LAB-V70
vlan 90
 name LAB-V90
vlan 100
 name LAB-V100
vlan 110
 name LAB-V110
vlan 120
 name LAB-V120
interface GigabitEthernet0/1
 description Router-uplink
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,70,90,100,110,120
 no shutdown
interface FastEthernet0/1
 description DBP-Infra
 switchport mode access
 switchport access vlan 70
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
interface FastEthernet0/2
 description DBP-Local
 switchport mode access
 switchport access vlan 70
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
interface FastEthernet0/3
 description DBP-PC10
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
interface FastEthernet0/4
 description DBP-Guest
 switchport mode access
 switchport access vlan 100
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
interface FastEthernet0/5
 description DBP-NVR
 switchport mode access
 switchport access vlan 110
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
interface FastEthernet0/6
 description DBP-PC20
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
interface FastEthernet0/7
 description DBP-PC30
 switchport mode access
 switchport access vlan 30
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
interface FastEthernet0/8
 description DBP-Staff
 switchport mode access
 switchport access vlan 120
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
interface range FastEthernet0/9 - 24
 shutdown
interface GigabitEthernet0/2
 shutdown
line vty 0 4
 transport input none
end
