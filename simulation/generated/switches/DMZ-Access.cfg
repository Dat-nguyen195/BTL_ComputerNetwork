! Minimal TV4 lab switch; review against TV2 campus module before use.
! Reference: 2960 with FastEthernet0/1-24 and GigabitEthernet0/1-2.
hostname DMZ-Access
vlan 80
 name LAB-V80
interface GigabitEthernet0/1
 description Router-uplink
 switchport mode access
 switchport access vlan 80
 no shutdown
interface FastEthernet0/1
 description Main-WebDMZ
 switchport mode access
 switchport access vlan 80
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
interface FastEthernet0/2
 description Main-ProxyDMZ
 switchport mode access
 switchport access vlan 80
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
interface range FastEthernet0/3 - 24
 shutdown
interface GigabitEthernet0/2
 shutdown
line vty 0 4
 transport input none
end
