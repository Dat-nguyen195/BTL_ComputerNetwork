! Cisco Packet Tracer lab only; Main-Core; credential public in lab.
! Applied via native enterCommand with mode readbacks in management-ssh.json.
configure terminal
ip domain-name hospital.test
username labadmin privilege 1 secret HospitalLab2026Only
crypto key generate rsa general-keys modulus 1024
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 2
ip access-list standard MGMT-SSH-ONLY
 permit host 10.10.90.11
 deny any
exit
line vty 0 4
 login local
 transport input ssh
 access-class MGMT-SSH-ONLY in
 exec-timeout 5 0
end
write memory
