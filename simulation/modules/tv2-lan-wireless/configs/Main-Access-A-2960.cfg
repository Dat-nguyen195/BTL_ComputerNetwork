! TV2 2960 adapter - NOT RUN; optional staff AP must be created.
hostname Main-Access-A
spanning-tree mode rapid-pvst
vlan 10
 name HOSPITAL-V10
vlan 20
 name HOSPITAL-V20
vlan 30
 name HOSPITAL-V30
vlan 40
 name HOSPITAL-V40
vlan 50
 name HOSPITAL-V50
vlan 60
 name HOSPITAL-V60
vlan 70
 name HOSPITAL-V70
vlan 90
 name HOSPITAL-V90
vlan 100
 name HOSPITAL-V100
vlan 110
 name HOSPITAL-V110
vlan 120
 name HOSPITAL-V120
interface Port-channel1
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,50,60,70,90,100,110,120
interface GigabitEthernet0/1
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,50,60,70,90,100,110,120
 channel-group 1 mode passive
 no shutdown
interface GigabitEthernet0/2
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,50,60,70,90,100,110,120
 channel-group 1 mode passive
 no shutdown
interface FastEthernet0/1
 description PC-VLAN10
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
interface FastEthernet0/2
 description PC-VLAN20
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
interface FastEthernet0/3
 description AP-PT-GUEST-UNTAGGED
 switchport mode access
 switchport access vlan 100
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
interface FastEthernet0/4
 description ADD-AP-PT-STAFF-UNTAGGED
 switchport mode access
 switchport access vlan 120
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
interface range FastEthernet0/5 - 24
 shutdown
interface Vlan90
 ip address 10.10.90.32 255.255.255.0
 no shutdown
ip default-gateway 10.10.90.1
line vty 0 15
 transport input none
end
