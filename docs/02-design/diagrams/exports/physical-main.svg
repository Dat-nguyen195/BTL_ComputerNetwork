<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1030" viewBox="0 0 1600 1030"><rect width="1600" height="1030" fill="#f8fafc" /><polyline points="662.5,452.5 800.0,295.0" fill="none" stroke="#64748b" stroke-width="2" /><polyline points="800.0,295.0 942.5,452.5" fill="none" stroke="#64748b" stroke-width="2" /><polyline points="800.0,345 800.0,535 662.5,535 662.5,565" fill="none" stroke="#64748b" stroke-width="2" /><polyline points="942.5,452.5 942.5,615.0" fill="none" stroke="#64748b" stroke-width="2" /><polyline points="800.0,345 800.0,700 662.5,700 662.5,730" fill="none" stroke="#64748b" stroke-width="2" /><polyline points="1060,452.5 1090,452.5 1090,772.5 1060,772.5" fill="none" stroke="#64748b" stroke-width="2" /><polyline points="415,805.0 480,805.0 480,295.0 540,295.0" fill="none" stroke="#64748b" stroke-width="2" /><polyline points="415,665.0 480,665.0 480,295.0 540,295.0" fill="none" stroke="#64748b" stroke-width="2" /><polyline points="415,525.0 480,525.0 480,295.0 540,295.0" fill="none" stroke="#64748b" stroke-width="2" /><text x="480" y="215" fill="#334155" font-family="DejaVu Sans,Arial" font-size="12" text-anchor="middle">4×10G/IDF</text><polyline points="415,385.0 480,385.0 480,295.0 540,295.0" fill="none" stroke="#64748b" stroke-width="2" /><polyline points="415,245.0 480,245.0 480,295.0 540,295.0" fill="none" stroke="#64748b" stroke-width="2" /><polyline points="1185,805.0 1120,805.0 1120,295.0 1060,295.0" fill="none" stroke="#64748b" stroke-width="2" /><polyline points="1185,665.0 1120,665.0 1120,295.0 1060,295.0" fill="none" stroke="#64748b" stroke-width="2" /><polyline points="1185,525.0 1120,525.0 1120,295.0 1060,295.0" fill="none" stroke="#64748b" stroke-width="2" /><text x="1120" y="215" fill="#334155" font-family="DejaVu Sans,Arial" font-size="12" text-anchor="middle">4×10G/IDF</text><polyline points="1185,385.0 1120,385.0 1120,295.0 1060,295.0" fill="none" stroke="#64748b" stroke-width="2" /><polyline points="1185,245.0 1120,245.0 1120,295.0 1060,295.0" fill="none" stroke="#64748b" stroke-width="2" /><rect x="30" y="20" width="1540" height="65" rx="10" fill="#dbeafe" stroke="#94a3b8" /><text x="800.0" y="57.5" fill="#0f172a" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">MAIN: THIẾT KẾ VẬT LÝ - CHƯA KHẢO SÁT / CHƯA HA RUNTIME</text><rect x="30" y="100" width="1540" height="60" rx="10" fill="#ffffff" stroke="#94a3b8" /><text x="800.0" y="125.0" fill="#0f172a" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">A/B: mỗi tòa 5 tầng × 10 phòng; phòng MDF cách tòa 50 m (không phải chiều dài cáp)</text><text x="800.0" y="145.0" fill="#0f172a" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">20 switch ×48 cổng; PC 600→720, AP 30→40, camera 40→50; còn 150 cổng sau tăng trưởng</text><rect x="540" y="245" width="520" height="100" rx="10" fill="#bfdbfe" stroke="#94a3b8" /><text x="800.0" y="280.0" fill="#0f172a" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">MDF: 2 CORE L3 (DỰ TRÙ)</text><text x="800.0" y="300.0" fill="#0f172a" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">Mỗi core: 20 uplink access +8 cổng dịch vụ =28/32</text><text x="800.0" y="320.0" fill="#0f172a" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">2×40G core-core; HA gateway cần cấu hình/test riêng</text><rect x="545" y="405" width="235" height="95" rx="10" fill="#e0e7ff" stroke="#94a3b8" /><text x="662.5" y="437.5" fill="#0f172a" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">WAN gateway pair dự trù</text><text x="662.5" y="457.5" fill="#0f172a" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">2 leased lines→DBP/BHTQ</text><text x="662.5" y="477.5" fill="#0f172a" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">WAN nối Core, không nối FW</text><rect x="825" y="405" width="235" height="95" rx="10" fill="#fee2e2" stroke="#94a3b8" /><text x="942.5" y="437.5" fill="#0f172a" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">Firewall pair dự trù</text><text x="942.5" y="457.5" fill="#0f172a" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">Core↔FW↔Internet Edge</text><text x="942.5" y="477.5" fill="#0f172a" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">ZBF lab một node</text><rect x="545" y="565" width="235" height="100" rx="10" fill="#dcfce7" stroke="#94a3b8" /><text x="662.5" y="600.0" fill="#0f172a" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">2 switch SERVER FARM</text><text x="662.5" y="620.0" fill="#0f172a" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">VLAN70/90/110</text><text x="662.5" y="640.0" fill="#0f172a" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">8→10 server nội bộ +NVR</text><rect x="825" y="565" width="235" height="100" rx="10" fill="#fee2e2" stroke="#94a3b8" /><text x="942.5" y="600.0" fill="#0f172a" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">2 switch DMZ RIÊNG</text><text x="942.5" y="620.0" fill="#0f172a" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">2 server; VLAN80 gateway FW</text><text x="942.5" y="640.0" fill="#0f172a" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">Không uplink thẳng Core</text><rect x="545" y="730" width="235" height="85" rx="10" fill="#fef3c7" stroke="#94a3b8" /><text x="662.5" y="757.5" fill="#0f172a" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">2 WLC dự trù</text><text x="662.5" y="777.5" fill="#0f172a" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">Mỗi WLC hỗ trợ ≥64 AP</text><text x="662.5" y="797.5" fill="#0f172a" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">AP uplink 1G trong baseline</text><rect x="825" y="730" width="235" height="85" rx="10" fill="#fef3c7" stroke="#94a3b8" /><text x="942.5" y="757.5" fill="#0f172a" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">Edge /2 modem xDSL</text><text x="942.5" y="777.5" fill="#0f172a" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">PBR/PAT tại Edge</text><text x="942.5" y="797.5" fill="#0f172a" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">ISP2:8080 công bố DMZ</text><rect x="30" y="925" width="1540" height="75" rx="10" fill="#ffffff" stroke="#94a3b8" /><text x="800.0" y="957.5" fill="#0f172a" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">Mỗi IDF có 2 switch; tổng 4 link 10G/IDF (2 link tới mỗi core), tuyến A/B riêng cần khảo sát.</text><text x="800.0" y="977.5" fill="#0f172a" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">Uplink độc lập/RSTP; chỉ LACP xuyên core khi có một logical switch được cấu hình. GPON: phương án riêng, chưa triển khai.</text><rect x="35" y="755" width="380" height="100" rx="10" fill="#ffffff" stroke="#94a3b8" /><text x="225.0" y="790.0" fill="#0f172a" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">TÒA A - TẦNG 1: 1 IDF /2 switch</text><text x="225.0" y="810.0" fill="#0f172a" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">Sau tăng trưởng:72 PC +4 AP +5 camera</text><text x="225.0" y="830.0" fill="#0f172a" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">81/96 cổng; Cat6 tới 10 phòng</text><rect x="35" y="615" width="380" height="100" rx="10" fill="#ffffff" stroke="#94a3b8" /><text x="225.0" y="650.0" fill="#0f172a" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">TÒA A - TẦNG 2: 1 IDF /2 switch</text><text x="225.0" y="670.0" fill="#0f172a" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">Sau tăng trưởng:72 PC +4 AP +5 camera</text><text x="225.0" y="690.0" fill="#0f172a" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">81/96 cổng; Cat6 tới 10 phòng</text><rect x="35" y="475" width="380" height