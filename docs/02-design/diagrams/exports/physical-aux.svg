0" y="155.0" fill="#0f172a" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">Main WAN gateway</text><text x="700.0" y="175.0" fill="#0f172a" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">2 leased lines tách biệt; một tuyến/site</text><rect x="30" y="820" width="1340" height="80" rx="10" fill="#ffffff" stroke="#94a3b8" /><text x="700.0" y="855.0" fill="#0f172a" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">Mỗi site:8×48=384 cổng; dùng 277 hiện tại /334 sau tăng trưởng, dư 50.</text><text x="700.0" y="875.0" fill="#0f172a" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">AP6→8, camera8→10, server2→3 và1 NVR; NVR ghi local. ACL/SSID theo từng site, không kéo VLAN qua WAN.</text><rect x="55" y="270" width="590" height="75" rx="10" fill="#e0e7ff" stroke="#94a3b8" /><text x="350.0" y="302.5" fill="#0f172a" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">DBP: WAN router (lab một node)</text><text x="350.0" y="322.5" fill="#0f172a" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">Duy nhất một leased line; không có local Internet breakout</text><rect x="55" y="410" width="590" height="95" rx="10" fill="#bfdbfe" stroke="#94a3b8" /><text x="350.0" y="442.5" fill="#0f172a" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">TẦNG 1 - IT /CCL /MDF</text><text x="350.0" y="462.5" fill="#0f172a" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">2 distribution dự trù,8 uplink access/core</text><text x="350.0" y="482.5" fill="#0f172a" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">Server2→3 +NVR1; mỗi NVR≥16 kênh</text><rect x="55" y="580" width="270" height="120" rx="10" fill="#ffffff" stroke="#94a3b8" /><text x="190.0" y="615.0" fill="#0f172a" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">TẦNG 1:4 switch /192 cổng</text><text x="190.0" y="635.0" fill="#0f172a" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">Sau tăng trưởng:156 PC</text><text x="190.0" y="655.0" fill="#0f172a" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">4 AP+5 camera+3 server+1NVR</text><text x="190.0" y="675.0" fill="#0f172a" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">169/192 cổng</text><rect x="375" y="580" width="270" height="120" rx="10" fill="#ffffff" stroke="#94a3b8" /><text x="510.0" y="615.0" fill="#0f172a" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">TẦNG 2: IDF /4 switch</text><text x="510.0" y="635.0" fill="#0f172a" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">Sau tăng trưởng:156 PC</text><text x="510.0" y="655.0" fill="#0f172a" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">4 AP+5 camera</text><text x="510.0" y="675.0" fill="#0f172a" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">165/192 cổng</text><rect x="755" y="270" width="590" height="75" rx="10" fill="#e0e7ff" stroke="#94a3b8" /><text x="1050.0" y="302.5" fill="#0f172a" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">BHTQ: WAN router (lab một node)</text><text x="1050.0" y="322.5" fill="#0f172a" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">Duy nhất một leased line; không có local Internet breakout</text><rect x="755" y="410" width="590" height="95" rx="10" fill="#bfdbfe" stroke="#94a3b8" /><text x="1050.0" y="442.5" fill="#0f172a" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">TẦNG 1 - IT /CCL /MDF</text><text x="1050.0" y="462.5" fill="#0f172a" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">2 distribution dự trù,8 uplink access/core</text><text x="1050.0" y="482.5" fill="#0f172a" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">Server2→3 +NVR1; mỗi NVR≥16 kênh</text><rect x="755" y="580" width="270" height="120" rx="10" fill="#ffffff" stroke="#94a3b8" /><tex