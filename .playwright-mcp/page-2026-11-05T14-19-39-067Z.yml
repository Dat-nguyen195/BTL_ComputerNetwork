          - paragraph [ref=e100]: This snapshot provides the updated replication package supplied with the revised manuscript. The complete archive is byte-identical to the dated supplementary attachment. Frozen measurements, margins and primary verdicts are unchanged; subsequent evidence and reporting audits are kept separate.
