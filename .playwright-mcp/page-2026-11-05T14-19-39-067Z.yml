            - code [ref=e116]: PREVIEW_MANIFEST.json
            - text: records original member paths and checksums. Follow the reproduction instructions inside the extracted complete package, rather than running analyses in the partial preview.
          - heading "Changes in this revision" [level=2] [ref=e117]
          - paragraph [ref=e118]: The reporting audit reconciles divergence-band counts, placebo populations and original/normalized grading. The synthesis generates the three-state evidence summary and separate Haiku NEW/POOLED table from saved analyses. An auxiliary P6 export now preserves percentage-point units without multiplying them again. No new model calls, refitting or inferential tests were added for these reports. Secondary theory, protocol history and scoped diagnostics are retained.
          - paragraph [ref=e119]: The package was checked with 32 passing tests, 538 distributed payload files, 195 provenance references and 200 frozen artifact files. The tested runtime is Python 3.12.3; dependency versions and full numerical reproduction instructions are in the complete package. Frozen condition means and matched-reader results remain reproducible offline without API keys.
          - heading "Scope and interpretation" [level=2] [ref=e120]
          - paragraph [ref=e121]: Four readers cover the frozen study; Sonnet remains a separate matched subset. NEW evidence covers only complete Haiku exports, with incomplete open-reader exports and no independent returned-model identity verification from that export. POOLED includes original groups and is not independent confirmation. Wide P1 intervals remain inconclusive; the summary's P4 status concerns its slope only, without replacing the full frozen criterion. MAE comparisons are descriptive. Scoped executable audits do not replace independent human annotation, and changed witness selections have no new measured reader outcomes.
          - paragraph [ref=e122]: This reviewer distribution grants no new license over third-party material. Public release is planned after acceptance, subject to coauthor agreement.