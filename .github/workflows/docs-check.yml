name: Documentation and WAN reference checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check UTF-8, Markdown fences, local links and task IDs
        run: python3 scripts/check_docs.py
      - name: Check WAN reference declarations and static fault scenarios
        run: python3 scripts/check_wan.py
