name: Artifact and repository scope checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check-docs:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify Git scope and artifact integrity
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          import json
          import subprocess
          import zipfile

          root = Path.cwd()
          tracked = subprocess.run(
              ['git', 'ls-files', '--', 'scripts', 'script', 'submission'],
              check=True, capture_output=True, text=True).stdout
          assert not tracked.strip(), 'Local tools or removed submission output are tracked'
          assert not (root / 'submission').exists(), 'Removed submission output is present'
          qa = json.loads((root / 'test_results/report-latex/qa.json').read_text(encoding='utf-8'))
          pdf = root / 'docs/06-report/final/report.pdf'
          assert pdf.read_bytes().startswith(b'%PDF-')
          native = root / 'simulation/packet-tracer/hospital-3sites.pkt'
          assert hashlib.sha256(native.read_bytes()).hexdigest() == qa['runtime_native_sha256']
          with zipfile.ZipFile(root / 'docs/06-report/final/report-latex.zip') as archive:
              assert archive.testzip() is None, 'Damaged source ZIP'
              assert {'report.tex', 'header.tex', 'cover.tex', 'fonts.tex'} <= set(archive.namelist())
              for name in archive.namelist():
                  source = Path(name)
                  assert not source.is_absolute() and '..' not in source.parts, name
          print('OK: Git scope, PDF format, saved native hash and source ZIP integrity')
