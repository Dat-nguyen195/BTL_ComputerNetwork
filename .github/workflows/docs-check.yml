name: Offline documentation, WAN, security and capacity checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check generated configs, docs, capacity, WAN and security (not runtime)
        run: python3 scripts/verify.py
